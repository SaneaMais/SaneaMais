<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
        integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="../../img/MicrosoftTeams-image-removebg-preview.png" type="image/x-icon">
    <link rel="stylesheet" href="../../CSS/Cadastro/style.css">
    <title>Cadastro</title>
</head>

<body>
    <main>
        <section class="box-form">
            <form action="../../HTML/Publicacao/publicacao/index.html" id="form">
                <section class="form-content">
                    <h3 class="titulo">Olá seja bem vindo!</h3>
                    <p class="sub-titulo">Estamos muito animados em ter você aqui!</p>
                    <section class="figura-logo">
                        <article class="logo-container">
                            <a href="../../index.html">
                                <img src="../../img/LOGO2.png" alt="Logo">
                            </a>
                        </article>
                    </section>
                    <p class="register-link">
                        Já tem uma conta? <a href="../../HTML/login/index.html">Entre</a><br>
                        Você é uma empresa? <a href="../../HTML/cadastro/cnpj.html">Cadastre-se</a>
                    </p>
                    <article class="form-input">
                        <label for="email">Email <span>*</span> </label>
                        <input type="text" placeholder="Digite seu email" id="email">
                        <small></small>
                    </article>
                    <article class="form-input">
                        <label for="numero">Número de telefone <span>*</span> </label>
                        <input type="text" placeholder="Número de telefone" id="numero" maxlength="15">
                        <small></small>
                    </article>
                    <article class="form-input">
                        <label for="nome">Nome de usuário <span>*</span> </label>
                        <input type="text" placeholder="Nome de usuário" id="nome">
                        <small></small>
                    </article>
                    <article class="form-input">
                        <label for="data">Data de nascimento <span>*</span> </label>
                        <input type="text" placeholder="__/__/____" id="data" maxlength="10">
                        <small></small>
                    </article>
                    <article class="form-input">
                        <label for="cep">Cep <span>*</span> </label>
                        <input type="text" placeholder="Cep" id="cep" maxlength="9">
                        <small></small>
                    </article>
                    <section class="form-input input__wrapper">
                        <label for="senha">Senha <span>*</span> </label>
                        <input type="password" placeholder="Senha" id="senha" class="input__field" maxlength="30">
                        <img alt="Eye Icon" title="Eye Icon" src="../../img/Login/eye-off.svg" class="input__icon">
                        <small id="senhaError"></small>
                    </section>
                </section>
                <input type="submit" value="Entrar" id="Entrar">
                <article id='msgError'></article>
                <article id='msgSuccess'></article>
                <small id="textForm"></small>
                <article class="alternative1">
                    <span>ou</span>
                </article>
                <article class="media">
                    <a href="#" class="icon">
                        <img src="../../img/Login/icons8-google-logo.svg" alt="Google">
                    </a>
                    <a href="#" class="icon">
                        <img src="../../img/Login/icons8-linkedin.svg" alt="Linkedin">
                    </a>
                    <a href="#" class="icon">
                        <img src="../../img/Login/icons8-facebook-novo.svg" alt="Facebook">
                    </a>
                </article>
            </form>
        </section>
    </main>
    <footer></footer>
    <script src="../../js/Cadastro/validacao.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.7/inputmask.min.js"></script>
</body>

</html>
